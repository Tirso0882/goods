# The support agent's core: the loop, the tools, the commerce port client and
# the persistence of support cases. It knows neither Medusa nor the web shell
# (ADR 0019), so it carries no web framework dependency.
[project]
name = "agent-core"
version = "0.0.0"
description = "Platform-independent core of the support agent"
requires-python = "==3.12.*"
dependencies = [
    "langchain>=1.5.0",
    "psycopg[binary]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
