name: Deploy
run-name: Deploy ${{ inputs.release }}

# CI calls this when a release is published. Run it by hand with an older
# release to roll back: the same path, so rollback is tested every release
# (docs/runbooks/deploy-and-rollback.md).
on:
  workflow_call:
    inputs:
      release:
        type: string
        required: true
    secrets:
      RAILWAY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Release tag (v0.1.0), or the full SHA of a green main CI run
        type: string
        required: true

permissions:
  contents: read

# One release at a time, and never cancel one halfway: a cancelled run could
# leave the server on a new release and the worker on the old one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # CI's automatic rollback calls this after a failed job in the same run.
    # Without this, the implicit success() might count that failure and skip
    # the rollback. Changes nothing when the run has no failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Holds the RAILWAY_TOKEN secret. A called job takes the secret's value
    # from the environment it names, but only when the caller passes the
    # secret: otherwise it's an empty string, with no error.
    environment:
      name: production
      url: https://goods-storefront-production.up.railway.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Images are tagged by commit, so a release tag becomes its commit here.
      # A tag that doesn't exist fails the run before Railway is touched.
      - id: resolve
        run: |
          if [[ $RELEASE =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)
            echo "$RELEASE is $sha"
          else
            sha=$RELEASE
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
      - run: scripts/railway-deploy.sh "$SHA"
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
