name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  MEDUSA_DISABLE_TELEMETRY: "true"
  # Where the smoke test reaches the store. Same as the url in deploy.yml
  # (docs/runbooks/railway.md#current-domains).
  STOREFRONT_URL: https://goods-storefront-production.up.railway.app

# Job names are required status checks in branch protection. Renaming one
# means updating the protection rule too.
jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
        env:
          # next.config.js refuses to load without it. Not a real key.
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
      # Ours and the installed Medusa packages', so a Medusa upgrade can't
      # bring in a migration that breaks rollback without a review.
      - run: pnpm check:migrations

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Same images as compose.yaml. Dependabot only bumps them there, so copy
      # each new tag and digest here in the same pull request.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder

  # Backs up throwaway databases with the backup image and restores them
  # (apps/backup/test.sh). Railway and R2 are not touched.
  backup:
    name: backup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apps/backup/test.sh

  # Lives in this workflow because `needs:` only reaches jobs in the same run.
  publish:
    name: publish (${{ matrix.image }})
    needs: [format, lint, typecheck, test, build, backup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        # backup is the cron service; releases don't deploy it
        # (docs/runbooks/restore-all-state.md#update-the-backup-image).
        image: [backend, storefront, backup]
    permissions:
      contents: read # check out the build context
      packages: write # push images, and the attestation, to GHCR
      # Build provenance with actions/attest, as documented in
      # https://github.com/actions/attest/blob/v4.2.2/README.md#usage
      # https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the attestation on GitHub
    env:
      IMAGE: ghcr.io/tirso0882/goods-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No build args: the storefront reads its URLs and keys at runtime, so
      # this image deploys to any environment (docs/architecture/containers.md).
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # The source label links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for organization-owned repositories.
          create-storage-record: false

  # Opens or updates the Release PR, and on the merge of that PR tags the
  # release and publishes it (docs/runbooks/deploy-and-rollback.md). After
  # publish, so a release's images exist before anything deploys it.
  release:
    name: release
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Everything goes through the app token below.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # The GitHub App's token, not GITHUB_TOKEN: a pull request opened with
      # GITHUB_TOKEN doesn't trigger workflows, so the Release PR would never
      # get the required checks.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # release commits, tags and releases
          permission-pull-requests: write # the Release PR
          permission-issues: write # its labels
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Only a release deploys. An ordinary merge stops after release.
  deploy:
    name: deploy
    needs: [release]
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      release: ${{ github.sha }}
    # Only this secret. Its value comes from the production environment, which
    # the called job names; without passing it, it arrives empty.
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Checks from the outside that the store works on the new release: what
  # Railway's health checks can't see. On failure the jobs below roll back, and
  # this job stays red so the bad release is noticed
  # (docs/runbooks/deploy-and-rollback.md#smoke-test).
  smoke:
    name: smoke
    needs: [deploy]
    runs-on: ubuntu-24.04
    # Above the script's worst case, about 5 minutes when every request hangs:
    # a job that times out is cancelled, not failed, and nothing rolls back.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/smoke-test.sh "$STOREFRONT_URL"

  # The release before this one, unless rolling back past this one isn't safe.
  rollback-target:
    name: rollback target
    needs: [smoke]
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.target.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags and the history between them
      - id: target
        run: |
          release=$(scripts/rollback-target.sh "$GITHUB_SHA")
          echo "Rolling back to $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Once: nothing rolls back the rollback, so a failure the previous release
  # shares (Railway down) can't loop.
  rollback:
    name: rollback
    needs: [rollback-target]
    # A grandparent failed (smoke), so the default success() would skip it.
    if: ${{ !cancelled() && needs.rollback-target.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      release: ${{ needs.rollback-target.outputs.release }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  rollback-smoke:
    name: smoke after rollback
    needs: [rollback]
    if: ${{ !cancelled() && needs.rollback.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/smoke-test.sh "$STOREFRONT_URL"
