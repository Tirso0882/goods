version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Medusa packages share one version and must move together.
      medusa:
        patterns:
          - "@medusajs/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Watches apps/backend/Dockerfile and apps/storefront/Dockerfile. Both take
  # the node base image from `ARG NODE_IMAGE`, and Dependabot does not resolve
  # ARGs in FROM (dependabot/dependabot-core#2057), so bump that digest by hand.
  - package-ecosystem: docker
    directories:
      - /
      - /apps/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
