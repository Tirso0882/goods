version: 2

# Major versions are upgraded on purpose in their own PR, so npm and image
# updates skip them. These ignores also apply to security updates: a fix that
# needs a new major shows up as an alert only.
#
# Patch updates of npm and actions, outside the medusa group, merge on their
# own once the required checks pass (.github/workflows/dependabot-auto-merge.yml).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Medusa packages share one version and must move together.
      medusa:
        patterns:
          - "@medusajs/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The node image in every FROM line of apps/backend/Dockerfile and
  # apps/storefront/Dockerfile, and the Postgres image of apps/backup/Dockerfile,
  # which must stay on the server's major. apps/backup/test.sh pins the node
  # and pgvector images too: copy their bumps there.
  - package-ecosystem: docker
    directories:
      - /apps/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Postgres, Redis and Ollama in compose.yaml. The CI test job pins the same
  # Postgres and Redis, which Dependabot leaves alone: copy each bump there.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Local tags of the images compose.yaml builds; not on any registry.
      - dependency-name: goods-stack-backend
      - dependency-name: goods-stack-storefront
